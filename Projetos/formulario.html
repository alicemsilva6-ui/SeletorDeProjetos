<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form class="row g-3" style="font-family: 'Times New Roman', Times, serif;">
        <div class="col-md-6">
            <label for="inputEmail4" class="form-label">NOME COMPLETO</label>
            <input type="email" class="form-control" id="inputEmail4">
        </div>
        <div class="col-md-6">
            <label for="exampleFormControlInput1" class="form-label">TELEFONE </label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="(XX) XXXXX-XXXX">
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">E-MAIL</label>
            <input type="text" class="form-control" id="inputAddress" placeholder="nome@gmail.com">
        </div>
        <div class="mb-3">
            <label for="data" class="form-label">SELECIONE A DATA</label>
            <input type="date" class="form-control" id="data">
        </div>


        <div class="col-md-4">
            <label for="inputState" class="form-label">Cidade</label>
            <select id="inputState" class="form-select">
                <option selected>Selecione aqui...</option>
                <option>Rio de Janeiro</option>
                <option>São Paulo</option>
                <option>Brasília</option>
                <option>Belo Horizonte</option>
            </select>
        </div>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                    Concordo com os termos 
                </label>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Enviar Informações</button>
        </div>
    </form>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
